        reader.onload = (ev) => {
          document.getElementById("qr-area").innerHTML = '<img src="' + ev.target.result + '" alt="QR" style="width:100%;height:100%;object-fit:contain;display:block;"/>';
          if (window.parent && window.parent.onUserUploadedQR) {
            window.parent.onUserUploadedQR();
          }
        };
        reader.readAsDataURL(file);
      }
      function loadFoto(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          document.getElementById("foto-area").innerHTML = '<img src="' + ev.target.result + '" alt="Foto" style="width:100%;height:100%;object-fit:cover;object-position:center top;display:block;"/>';
          try { if (window.parent && window.parent.onIframeFotoLoaded) window.parent.onIframeFotoLoaded(ev.target.result); } catch(ex) {}
        };
        reader.readAsDataURL(file);
      }
      function loadAssinatura(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          document.getElementById("assinatura-area").innerHTML =
            '<img src="' + ev.target.result + '" alt="Assinatura" style="width:100%;height:100%;object-fit:contain;display:block;"/>';
          try { if (window.parent && window.parent.onIframeAssLoaded) window.parent.onIframeAssLoaded(ev.target.result); } catch(ex) {}
        };
        reader.readAsDataURL(file);
      }

      const ACENTOS = {
        A: ["Á","À","Â","Ã","Ä","á","à","â","ã","ä"],
        E: ["É","È","Ê","Ë","é","è","ê","ë"],
        I: ["Í","Ì","Î","Ï","í","ì","î","ï"],
        O: ["Ó","Ò","Ô","Õ","Ö","ó","ò","ô","õ","ö"],
        U: ["Ú","Ù","Û","Ü","ú","ù","û","ü"],
        C: ["Ç","ç"],
        N: ["Ñ","ñ"],
      };

      function removerAcentos(str) {
        let resultado = str;
        for (const [base, variantes] of Object.entries(ACENTOS)) {
          for (const v of variantes) {
            resultado = resultado.split(v).join(base);
          }
        }
        return resultado;
      }

      function gerarMrzL3(nomeCompleto) {
        const normalizado = removerAcentos(nomeCompleto).toUpperCase().replace(/[^A-Z ]/g, "");
        const partes = normalizado.trim().split(" ").filter(Boolean);
        if (partes.length === 0) return "<".repeat(30);
        const primeiro = partes[0];
        const restantes = partes.slice(1).join("<");
        const mrz = restantes ? primeiro + "<<" + restantes : primeiro + "<<";
        return mrz.padEnd(30, "<").slice(0, 30);
      }

      function atualizarMrz() {
        const nome = document.getElementById("nome_completo").value;
        document.getElementById("mrz_l3").value = gerarMrzL3(nome);
      }

      document.getElementById("nome_completo").addEventListener("input", atualizarMrz);
      atualizarMrz();

      function ajustarCursor(el, prev, next, posBefore) {
        el.value = next;
        const diff = next.length - prev.length;
        const pos  = Math.max(0, posBefore + diff);
        el.setSelectionRange(pos, pos);
      }

      const REGEX_LETRAS           = /[^\p{L} \-]/gu;
      const REGEX_LETRAS_PONTUACAO = /[^\p{L}0-9 .,\/\-]/gu;
      const REGEX_LETRAS_PAREN     = /[^\p{L} \-()']/gu;

      function aplicarMascaraLetras(el, regex) {
        el.addEventListener("input", function (e) {
          if (e.isComposing) return;
          const pos  = this.selectionStart;
          const prev = this.value;
          ajustarCursor(this, prev, prev.replace(regex, "").toUpperCase(), pos);
        });
        el.value = el.value.toUpperCase();
      }

      ["nome_completo","filiacao_1","filiacao_2","cat_hab"].forEach(function(id) {
        aplicarMascaraLetras(document.getElementById(id), REGEX_LETRAS);
      });
      aplicarMascaraLetras(document.getElementById("nacionalidade"), REGEX_LETRAS_PAREN);
      ["local","uf","observacoes","data_nascimento"].forEach(function(id) {
        aplicarMascaraLetras(document.getElementById(id), REGEX_LETRAS_PONTUACAO);
      });

      function aplicarMascaraCpf(valor) {
        const d = valor.replace(/\D/g, "").slice(0, 11);
        if (d.length <= 3) return d;
        if (d.length <= 6) return d.slice(0,3) + "." + d.slice(3);
        if (d.length <= 9) return d.slice(0,3) + "." + d.slice(3,6) + "." + d.slice(6);
        return d.slice(0,3) + "." + d.slice(3,6) + "." + d.slice(6,9) + "-" + d.slice(9);
      }
      document.getElementById("cpf").addEventListener("input", function () {
        ajustarCursor(this, this.value, aplicarMascaraCpf(this.value), this.selectionStart);
      });

      function aplicarMascaraData(el) {
        el.addEventListener("input", function () {
          const pos  = this.selectionStart;
          const prev = this.value;
          const d    = prev.replace(/\D/g, "").slice(0, 8);
          let result = d;
          if (d.length > 2) result = d.slice(0,2) + "/" + d.slice(2);
          if (d.length > 4) result = d.slice(0,2) + "/" + d.slice(2,4) + "/" + d.slice(4);
          ajustarCursor(this, prev, result, pos);
        });
      }

      [
        "habilitacao", "data_emissao", "validade",
        "cat_acc_val","cat_a_val","cat_a1_val","cat_b_val","cat_b1_val","cat_c_val","cat_c1_val",
        "cat_acc_hab","cat_a_hab","cat_a1_hab","cat_b_hab","cat_b1_hab","cat_c_hab","cat_c1_hab",
        "cat_d_val","cat_d1_val","cat_be_val","cat_ce_val","cat_c1e_val","cat_de_val","cat_d1e_val",
        "cat_d_hab","cat_d1_hab","cat_be_hab","cat_ce_hab","cat_c1e_hab","cat_de_hab","cat_d1e_hab",
      ].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) aplicarMascaraData(el);
      });

      function aplicarSomenteDigitos(el, max) {
        el.addEventListener("input", function () {
          ajustarCursor(this, this.value, this.value.replace(/\D/g, "").slice(0, max), this.selectionStart);
        });
      }

      aplicarSomenteDigitos(document.getElementById("registro"),            11);
      aplicarSomenteDigitos(document.getElementById("numero_vertical_sup"), 10);
      aplicarSomenteDigitos(document.getElementById("numero_vertical_inf"), 10);

      function aplicarAlphanumerico(el, max) {
        el.addEventListener("input", function () {
          ajustarCursor(
            this, this.value,
            this.value.replace(/[^A-Za-z0-9]/g, "").toUpperCase().slice(0, max),
            this.selectionStart
          );
        });
        el.value = el.value.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
      }

      aplicarAlphanumerico(document.getElementById("codigo_1"), 11);
      aplicarAlphanumerico(document.getElementById("codigo_2"), 11);

      function aplicarMascaraMrz(el, max) {
        el.addEventListener("input", function () {
          ajustarCursor(
            this, this.value,
            this.value.replace(/[^A-Z0-9<]/gi, "").toUpperCase().slice(0, max),
            this.selectionStart
          );
        });
        el.value = el.value.replace(/[^A-Z0-9<]/gi, "").toUpperCase();
      }

      aplicarMascaraMrz(document.getElementById("mrz_l1"), 30);
      aplicarMascaraMrz(document.getElementById("mrz_l2"), 30);
      aplicarMascaraMrz(document.getElementById("mrz_l3"), 30);

      aplicarMascaraLetras(
        document.getElementById("doc_identidade"),
        /[^\p{L}0-9 .\-\/]/gu
      );

      document.getElementById("modelo_cnh").addEventListener("input", function () {
        ajustarCursor(
          this, this.value,
          this.value.replace(/[^DPdp]/g, "").toUpperCase().slice(0, 1),
          this.selectionStart
        );
      });

      // ── SINCRONIZAÇÃO AUTOMÁTICA DA TABELA DE CATEGORIAS ──
      const ALL_CAT_TABLE_IDS = [
        "cat_acc_val","cat_acc_hab",
        "cat_a_val","cat_a_hab",
        "cat_a1_val","cat_a1_hab",
        "cat_b_val","cat_b_hab",
        "cat_b1_val","cat_b1_hab",
        "cat_c_val","cat_c_hab",
        "cat_c1_val","cat_c1_hab",
        "cat_d_val","cat_d_hab",
        "cat_d1_val","cat_d1_hab",
        "cat_be_val","cat_be_hab",
        "cat_ce_val","cat_ce_hab",
        "cat_c1e_val","cat_c1e_hab",
        "cat_de_val","cat_de_hab",
        "cat_d1e_val","cat_d1e_hab"
      ];

      function sincronizarTabelaCategorias(forcar) {
        if (window._userManuallyEditedCatTable && !forcar) return;
        const cat = (document.getElementById("cat_hab")?.value || "").toUpperCase().trim();
        const val = (document.getElementById("validade")?.value || "").trim();
        const hab = (document.getElementById("habilitacao")?.value || document.getElementById("data_emissao")?.value || "").trim();

        ALL_CAT_TABLE_IDS.forEach(function(id) {
          const el = document.getElementById(id);
          if (el) el.value = "";
        });

        function setCategoryVal(valId) {
          const el = document.getElementById(valId);
          if (el) el.value = val;
        }

        const catUpper = cat.toUpperCase().replace(/[^A-Z0-9]/g, "");

        // Categorias específicas/compostas
        if (catUpper.includes("ACC")) setCategoryVal("cat_acc_val");
        if (catUpper.includes("C1E")) setCategoryVal("cat_c1e_val");
        if (catUpper.includes("D1E")) setCategoryVal("cat_d1e_val");
        if (catUpper.includes("A1"))  setCategoryVal("cat_a1_val");
        if (catUpper.includes("B1"))  setCategoryVal("cat_b1_val");
        if (catUpper.includes("C1") && !catUpper.includes("C1E")) setCategoryVal("cat_c1_val");
        if (catUpper.includes("D1") && !catUpper.includes("D1E")) setCategoryVal("cat_d1_val");
        if (catUpper.includes("BE"))  setCategoryVal("cat_be_val");
        if (catUpper.includes("CE"))  setCategoryVal("cat_ce_val");
        if (catUpper.includes("DE"))  setCategoryVal("cat_de_val");

        // Categorias principais
        const hasA = catUpper.includes("A") && !catUpper.includes("ACC") && !catUpper.includes("A1");
        const hasB = catUpper.includes("B") && !catUpper.includes("B1") && !catUpper.includes("BE");
        const hasC = catUpper.includes("C") && !catUpper.includes("C1") && !catUpper.includes("CE") && !catUpper.includes("C1E") && !catUpper.includes("ACC");
        const hasD = catUpper.includes("D") && !catUpper.includes("D1") && !catUpper.includes("DE") && !catUpper.includes("D1E");
        const hasE = (catUpper.includes("E") && !catUpper.includes("BE") && !catUpper.includes("CE") && !catUpper.includes("DE") && !catUpper.includes("C1E") && !catUpper.includes("D1E"));

        if (hasA) setCategoryVal("cat_a_val");
        if (hasB) setCategoryVal("cat_b_val");
        if (hasC) setCategoryVal("cat_c_val");
        if (hasD) setCategoryVal("cat_d_val");
        if (hasE) setCategoryVal("cat_ce_val");
      }

      window.sincronizarTabelaCategorias = sincronizarTabelaCategorias;

      ALL_CAT_TABLE_IDS.forEach(function(id) {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener("input", function() {
            window._userManuallyEditedCatTable = true;
          });
        }
      });

      // Sincronização automática em eventos input/change dos campos principais
      ["cat_hab", "validade", "habilitacao", "data_emissao"].forEach(function(id) {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener("input", function() {
            sincronizarTabelaCategorias(true);
          });
          el.addEventListener("change", function() {
            sincronizarTabelaCategorias(true);
          });
        }
      });

      sincronizarTabelaCategorias(true);
    </script>
  </body>
